{{ define "main" }}
{{ partial "page-title.html" . }}

<!-- Import Alpine.js -->
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

<section x-data="archiveFilter()" class="py-12 bg-[#f9f9f3]">
  <div class="container">
    <!-- Filter Dropdowns -->
    <div class="flex flex-wrap gap-4 mb-8">
      <select x-model="filters.impact" class="p-2 border rounded">
        <option value="">Impact</option>
        <template x-for="tag in impacts" :key="tag">
          <option x-text="tag"></option>
        </template>
      </select>

      <select x-model="filters.location" class="p-2 border rounded">
        <option value="">Location</option>
        <template x-for="tag in locations" :key="tag">
          <option x-text="tag"></option>
        </template>
      </select>

      <select x-model="filters.locationType" class="p-2 border rounded">
        <option value="">Location Type</option>
        <template x-for="tag in locationTypes" :key="tag">
          <option x-text="tag"></option>
        </template>
      </select>

      <select x-model="filters.theme" class="p-2 border rounded">
        <option value="">Theme</option>
        <template x-for="tag in themes" :key="tag">
          <option x-text="tag"></option>
        </template>
      </select>
    </div>

    <!-- Archive Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <template x-for="item in filteredItems" :key="item.title">
        <div class="bg-white rounded shadow hover:shadow-lg transition overflow-hidden">
          <img :src="item.image" alt="" class="w-full h-48 object-cover">
          <div class="p-4">
            <h2 class="text-lg font-bold mb-2" x-text="item.title"></h2>
            <p class="text-sm text-gray-600 mb-2" x-text="item.description"></p>
            <p class="text-xs text-[#C18D52]">Tags: <span x-text="item.tags.join(', ')"></span></p>
            <a :href="item.link" class="text-blue-600 text-sm mt-2 inline-block">Learn more →</a>
          </div>
        </div>
      </template>
    </div>
  </div>
</section>

<script>
function archiveFilter() {
  return {
    filters: { impact: '', location: '', locationType: '', theme: '' },

    impacts: ["Storms","Flooding","Sea-Level Rise","Salinity","Rainfall","Heat","Freshwater","Deforestation","Displacement","Pollution"],
    locations: ["Bangladesh","Bengal Delta","Ghana","Puerto Rico","Mexico","United States","US-Mexico","Central America"],
    locationTypes: ["Borders","Rural","Urban","Coastal","Island","Detention","Refugee Camp"],
    themes: ["Labor","Transportation","Economy","School","Communication","Agriculture","Activism","Art","Family","LGBTQ","Youth","Refugees","Government","Deportation","Religion","NGOs","Health","COVID-19","Refugee Caravan","Music","Sustainability","Industry","Innovation"],

    items: [
      {{ range .Data.Pages }}
      {
        title: {{ .Title | jsonify }},
        description: {{ with .Params.description }}{{ . | jsonify }}{{ else }}""{{ end }},
        tags: {{ .Params.tags | jsonify }},
        image: {{ with .Params.thumbnail }}{{ printf `"https://photos.smugmug.com/photos/%s/0/O/%s-O.png"` . . }}{{ else }}""{{ end }},
        link: {{ .Permalink | jsonify }}
      },
      {{ end }}
    ],

    get filteredItems() {
      return this.items.filter(item => {
        const f = this.filters
        return (!f.impact || item.tags.includes(f.impact)) &&
               (!f.location || item.tags.includes(f.location)) &&
               (!f.locationType || item.tags.includes(f.locationType)) &&
               (!f.theme || item.tags.includes(f.theme))
      })
    }
  }
}
</script>
{{ end }}
