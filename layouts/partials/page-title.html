{{ $img := .Params.banner.background_img }}
{{ $title := or .Params.banner.title .Title }}

{{ if $img }}
  <!-- Homepage-style Hero with Image + Overlay + Socials -->
  <section class="hero-area" style="background-image: url('https://photos.smugmug.com/photos/{{ $img }}/0/O/{{ $img }}-O.png'); background-size: cover; background-position: center;">
    <div class="main-title">
      <div class="container main-circle">
        <div class="row align-items-center justify-content-center">
          <div class="row align-items-start col-lg-8 tagline-circle-div">
            <h3 class="text-white text-center home-tagline tagline-circle">{{ $title | safeHTML }}</h3>
          </div>
        </div>
      </div>

      <!-- Social Icons -->
      <ul class="list-unstyled ml-5 mt-3 position-relative zindex-1">
        {{ with (site.GetPage `/contact`).Params.socials }}
        {{ range . }}
        <li class="mb-3 social-icons-home">
          <a class="text-primary" href="{{.URL | safeURL }}" target="_blank">
            <i class="{{.icon}}"></i>
          </a>
        </li>
        {{ end }}
        {{ end }}
      </ul>
    </div>
  </section>
{{ else }}
  <!-- Original Blue Rounded Title Style with bg-shape fallback -->
  <section class="page-title position-relative overflow-hidden bg-shape-{{ index (last 2 (split (.Permalink | relURL | string) `/`)) 0 }}">
    <div class="container">
      <div class="row">
        <div class="col-12 text-center">
          <h1 class="text-white font-tertiary">{{ $title }}</h1>
        </div>
      </div>
    </div>
  </section>
{{ end }}
