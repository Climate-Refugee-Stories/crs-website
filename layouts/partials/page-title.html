<!-- Page Title -->
<section class="page-title position-relative overflow-hidden bg-shape-{{ index (last 2 (split (.Permalink | relURL | string) `/`)) 0 }}">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <h1 class="text-white font-tertiary">{{.Title}}</h1>
      </div>
    </div>
  </div>
</section>
<!-- /Page Title -->

<--Page Banner-->
  {{ with .Params.banner }}
<header class="hero-area" style="background-image: url('https://photos.smugmug.com/photos/{{ .background_img }}/0/O/{{ .background_img }}-O.png');">
  <div class="container text-center text-white">
    <h1>{{ .title }}</h1>
  </div>
</header>
{{ end }}
<!-- /Page Banner -->
