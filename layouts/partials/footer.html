<!-- Footer Banner Image -->
<div class="footer-banner-image">
  <img src="https://tinashull.smugmug.com/CRS-Website/Archive/US-Mexico-Border/i-GmLbXK9/A" alt="Footer Banner">
</div>

<footer class="footer-bg" style="background-color:#022D62; color:#FFFFFF;">
  <div class="container">
    <div class="row">

      <!-- Left section -->
      <div class="col-md-4 mb-4 text-center text-md-left">
        <img src="i-GmLbXK9/A" alt="Smug Mug Logo" class="footer-logo mb-3" style="max-width:150px;">
        <p>A public history project narrating the fight for climate justice.</p>
      </div>

      <!-- Middle section -->
      <div class="col-md-4 mb-4 text-center text-md-left">
        <h5>Our Work</h5>
        <ul class="footer-links" style="list-style:none; padding:0; margin:0;">
          <li><a href="/archive/" style="color:#FFFFFF;">Archive</a></li>
          <li><a href="/stories/" style="color:#FFFFFF;">Stories</a></li>
          <li><a href="/resources/" style="color:#FFFFFF;">Resources</a></li>
        </ul>
      </div>

      <!-- Right section -->
      <div class="col-md-4 mb-4 text-center text-md-left">
        <h5>Connect with Us</h5>
        <ul class="social-icons-list" style="list-style:none; padding:0; margin:0; display:flex; gap:.8rem; justify-content:center;">
          {{ with (site.GetPage `/contact`).Params.socials }}
            {{ range . }}
              <li>
                <a href="{{ .URL | safeURL }}" target="_blank" style="background:#FFFFFF; color:#022D62; border-radius:50%; width:42px; height:42px; display:inline-flex; align-items:center; justify-content:center;">
                  <i class="{{ .icon }}"></i>
                </a>
              </li>
            {{ end }}
          {{ end }}
        </ul>
        <form class="newsletter-form d-flex mt-3">
          <input type="email" placeholder="Email address" required class="form-control mr-2">
          <button type="submit" class="btn btn-light">Subscribe</button>
        </form>
      </div>

    </div>
  </div>

  <!-- Bottom strip -->
  <div class="footer-bottom text-center" style="font-size:0.85rem; margin-top:1rem; padding-top:1rem; border-top:1px solid rgba(255,255,255,0.3); color:#FFFFFF;">
    <p class="mb-0">&copy; {{ now.Format "2006" }} Climate Refugee Stories. All rights reserved.</p>
  </div>
</footer>
