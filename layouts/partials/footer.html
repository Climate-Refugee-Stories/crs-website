    <div class="container py-5">
      <div class="row">

        <!-- Left section -->
        <div class="col-md-4 mb-4 text-center text-md-left">
          <img src="i-GmLbXK9/A" alt="Smug Mug Logo" class="footer-logo mb-3" style="max-width:150px;">
          <p>A public history project narrating the fight for climate justice.</p>
        </div>

        <!-- Middle section -->
        <div class="col-md-4 mb-4 text-center text-md-left">
          <h5>Our Work</h5>
          <ul class="list-unstyled">
            <li><a href="/archive/">Archive</a></li>
            <li><a href="/stories/">Stories</a></li>
            <li><a href="/resources/">Resources</a></li>
          </ul>
        </div>

        <!-- Right section -->
        <div class="col-md-4 mb-4 text-center text-md-left">
          <h5>Connect with Us</h5>

      </div>

      <p class="mb-0">&copy; {{ now.Format "2006" }} Climate Refugee Stories. All rights reserved.</p>
    </div>
  </div>
</footer>

<!-- Collapsible Accessibility Toolbar -->
<div id="a11y-toolbar-wrapper" style="position: fixed; bottom: 1rem; right: 1rem; z-index: 9999;">
  <button id="a11y-toggle" class="btn btn-sm btn-primary">Accessibility Tools</button>
  <div id="a11y-toolbar" style="display:none; background: var(--primary-color); padding:0.5rem; border-radius:5px; margin-top:0.5rem; flex-wrap: wrap;">
    <button type="button" class="a11y-btn" data-a11y="font-inc" aria-label="Increase Text">A+</button>
    <button type="button" class="a11y-btn" data-a11y="font-dec" aria-label="Decrease Text">A−</button>
    <button type="button" class="a11y-btn" data-a11y="grayscale" aria-label="Grayscale">⬛︎⟡</button>
    <button type="button" class="a11y-btn" data-a11y="high" aria-label="High Contrast">HC</button>
    <button type="button" class="a11y-btn" data-a11y="negative" aria-label="Negative Contrast">NC</button>
    <button type="button" class="a11y-btn" data-a11y="light" aria-label="Light Background">LB</button>
    <button type="button" class="a11y-btn" data-a11y="underline" aria-label="Underline Links">U</button>
    <button type="button" class="a11y-btn" data-a11y="readable" aria-label="Readable Font">RF</button>
    <button type="button" class="a11y-btn a11y-reset" data-a11y="reset" aria-label="Reset">Reset</button>
  </div>
</div>

<script>
  const toggleBtn = document.getElementById('a11y-toggle');
  const toolbar = document.getElementById('a11y-toolbar');
  toggleBtn.addEventListener('click', () => {
    toolbar.style.display = toolbar.style.display === 'none' ? 'flex' : 'none';
    toolbar.style.flexDirection = 'row';
    toolbar.style.gap = '0.25rem';
  });
</script>

<!-- JS Plugins -->
{{ range site.Params.plugins.js}}
<script src="{{ .link | absURL }}"></script>
{{ end }}
