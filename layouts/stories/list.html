{{ define "main" }}
  <!-- Page title -->
  {{ partial "page-title.html" . }}

  <section class="section">
    <div class="container">

      <!-- Story Map -->
      {{ with site.Home.Params.stories.map }}
      <div class="row mb-5">
        <div class="col-12">
          <iframe 
            class="w-100 stories-map-embed" 
            src="{{ . }}" 
            style="height: 500px; border: none; border-radius: 8px;">
          </iframe>
        </div>
      </div>
      {{ end }}
      <!-- /Story Map -->

      <!-- Search Bar -->
      <div class="row search-row mb-4">
        {{ partial "search.html" . }}
      </div>
      <!-- /Search Bar -->

      <!-- Story Gallery -->
      <div class="row justify-content-center gallery">
        {{ range .Pages }}
          <div class="col-lg-3 col-md-4 col-sm-6 mb-4 d-flex justify-content-center">
            {{ partial "stories/story-card.html" . }}
          </div>
        {{ end }}
      </div>
      <!-- /Story Gallery -->

    </div>
  </section>
{{ end }}
