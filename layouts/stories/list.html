{{ define "main" }}

  <!-- Page title -->
  {{ partial "page-title.html" . }}

  <section class="section">
    <div class="container">

      <!-- Search Bar -->
      <div class="row search-row mb-4">
        {{ partial "search.html" . }}
      </div>

      <!-- Story Map -->
      {{ with site.Home.Params.stories.map }}
      <div class="row mb-5">
        <div class="col-12">
          <iframe
            frameborder="0"
            scrolling="no"
            marginheight="0"
            marginwidth="0"
            title="Stories Map"
            class="w-100"
            style="height: 550px;"
            src="{{ . }}">
          </iframe>
        </div>
      </div>
      {{ end }}
      <!-- /Story Map -->

      <!-- Story Gallery -->
      <div class="row gallery">
        {{ range .Pages }}
          <div class="col-lg-4 col-sm-6 mb-4">
            {{ partial "stories/story-card.html" . }}
          </div>
        {{ end }}
      </div>
  
      <!-- remove pagination from stories page
      <div class="row justify-content-center mt-5">
        {{ template "_internal/pagination.html" . }}
      </div>
      -->

    </div> 
  </section>
{{ end }}
