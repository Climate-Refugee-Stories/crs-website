{{ define "main" }}

  <!-- Page title -->
  {{ partial "page-title.html" . }}

     <!-- Search Bar -->
  <section class="section">
    <div class="container">
    <div class="row search-row mb-4">
        {{ partial "search.html" . }}
      </div>
     <!-- Search Bar -->

      <!-- Story Map -->
    {{ with site.Home.Params.stories.map }}
<div class="container">
  <div class="row mb-5">
    <div class="col-12">
    <iframe class="w-100 stories-map-embed" src="{{ . }}">      
     </iframe>
    </div>
  </div>
</div>
{{ end }}
      <!-- /Story Map -->

    <!-- Story Gallery -->
<div class="row justify-content-center gallery">
  {{ range .Pages }}
    <div class="col-lg-3 col-md-4 col-sm-6 mb-4 d-flex justify-content-center">
      {{ partial "stories/story-card.html" . }}
    </div>
  {{ end }}
</div>
    <!-- Story Map -->
  
      <!-- remove pagination from stories page
      <div class="row justify-content-center mt-5">
        {{ template "_internal/pagination.html" . }}
      </div>
      -->

    </div> 
  </section>
{{ end }}
