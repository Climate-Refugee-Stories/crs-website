<section class="section">
  <div class="container">
    <div class="row search-row">
      {{ partial "search.html" . }}
    </div>
    <div class="row" id="masonry-grid">
      {{ range (.Paginator 9).Pages }}
        <div class="col-lg-4 col-md-6 mb-4 masonry-item">
          {{ .Render "post" }}
        </div>
      {{ end }}
    </div>
    <div class="row justify-content-center mt-5">
      {{ template "_internal/pagination.html" . }}
    </div>
  </div>
</section>
{{ $region := index .Params.alt_cat 0 | lower | urlize }}

<div class="story-card border-{{ $region }}">
  <!-- your image, title, excerpt, button -->
</div>
