{{ define "main" }}
  {{ partial "page-title.html" . }}
  
  <section class="section">
    <div class="container">
   
      <!-- search -->
      <div class="row search-row mb-4">
        {{ partial "search.html" . }}
      </div>
      
<!-- Story Map -->
     <!-- ArcGIS Online map -->
      {{ with .Params.map }}
      <div class="row mb-5">
        <div class="col-12">
          <div id="arcgis-map" style="width:100%; height:500px; border-radius:1rem; overflow:hidden;">
            <iframe src="{{ . }}" width="100%" height="500" frameborder="0" style="border:0;" allowfullscreen></iframe>
          </div>
        </div>
      </div>
      {{ end }}
<!-- /Story Map -->
        
<!-- Story gallery -->   
      <div class="gallery">
        {{ range .Pages }}
          {{ partial "stories/story-card.html" . }}
        {{ end }}
      </div>
<!-- Story Gallery -->
  
      <!-- remove pagination from stories page
      <div class="row justify-content-center mt-5">
        {{ template "_internal/pagination.html" . }}
      </div>
      -->

    </div> <!-- /.container -->
  </section>
{{ end }}
